<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>BEAM — Basic Easy App Maker icon</title>
  <desc>A geometric lighthouse with amber light beams and the name BEAM against a dark night sky</desc>

  <defs>
    <clipPath id="ic">
      <rect x="20" y="20" width="640" height="640" rx="96"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="640" height="640" rx="96" fill="#0d1e35"/>

  <g clip-path="url(#ic)">

    <!-- Stars -->
    <circle cx="90"  cy="85"  r="2"   fill="white" opacity="0.50"/>
    <circle cx="170" cy="55"  r="1.5" fill="white" opacity="0.40"/>
    <circle cx="260" cy="78"  r="2"   fill="white" opacity="0.35"/>
    <circle cx="130" cy="140" r="1.5" fill="white" opacity="0.25"/>
    <circle cx="445" cy="65"  r="1.5" fill="white" opacity="0.40"/>
    <circle cx="545" cy="88"  r="2"   fill="white" opacity="0.50"/>
    <circle cx="608" cy="58"  r="1.5" fill="white" opacity="0.35"/>
    <circle cx="555" cy="145" r="1.5" fill="white" opacity="0.25"/>
    <circle cx="88"  cy="205" r="1.5" fill="white" opacity="0.30"/>
    <circle cx="594" cy="185" r="1.5" fill="white" opacity="0.30"/>

    <!-- Light beams -->
    <polygon points="340,143 20,38 20,275"  fill="#fbbf24" opacity="0.19"/>
    <polygon points="340,143 660,38 660,275" fill="#fbbf24" opacity="0.19"/>

    <!-- Sea -->
    <rect x="20" y="490" width="640" height="170" fill="#091f38"/>
    <rect x="30"  y="514" width="160" height="2.5" rx="1.5" fill="#1e4a74" opacity="0.70"/>
    <rect x="440" y="526" width="220" height="2.5" rx="1.5" fill="#1e4a74" opacity="0.70"/>
    <rect x="30"  y="544" width="120" height="2.5" rx="1.5" fill="#1e4a74" opacity="0.60"/>
    <rect x="460" y="552" width="200" height="2.5" rx="1.5" fill="#1e4a74" opacity="0.60"/>

    <!-- Light reflection on water -->
    <polygon points="296,490 384,490 445,660 235,660" fill="#fbbf24" opacity="0.07"/>

    <!-- Cliff/rock base -->
    <rect x="188" y="460" width="304" height="36" rx="8"  fill="#2d3748"/>
    <rect x="218" y="450" width="244" height="16" rx="5"  fill="#3d4f62"/>

    <!-- Tower body -->
    <rect x="302" y="186" width="76" height="274" fill="#dbd7cc"/>

    <!-- Subtle ring details -->
    <rect x="302" y="244" width="76" height="3" fill="#c4c0b4" opacity="0.8"/>
    <rect x="302" y="310" width="76" height="3" fill="#c4c0b4" opacity="0.8"/>
    <rect x="302" y="395" width="76" height="3" fill="#c4c0b4" opacity="0.8"/>
    <rect x="302" y="435" width="76" height="3" fill="#c4c0b4" opacity="0.8"/>

    <!-- Red stripe band -->
    <rect x="302" y="330" width="76" height="50" fill="#dc2626"/>

    <!-- Door -->
    <rect x="327" y="427" width="26" height="33" rx="13" fill="#1a2535"/>

    <!-- Porthole window -->
    <circle cx="340" cy="278" r="12" fill="#1a3050" stroke="#a8a4a0" stroke-width="3"/>

    <!-- Gallery ledge -->
    <rect x="266" y="175" width="148" height="11" rx="3" fill="#78909c"/>

    <!-- Lantern room -->
    <rect x="284" y="112" width="112" height="63" rx="5" fill="#1a2b40"/>
    <rect x="284" y="112" width="112" height="63" rx="5" fill="none" stroke="#4a5a6a" stroke-width="2"/>
    <line x1="321" y1="114" x2="321" y2="173" stroke="#243446" stroke-width="2.5"/>
    <line x1="340" y1="114" x2="340" y2="173" stroke="#243446" stroke-width="2.5"/>
    <line x1="359" y1="114" x2="359" y2="173" stroke="#243446" stroke-width="2.5"/>
    <line x1="285" y1="143" x2="395" y2="143" stroke="#243446" stroke-width="2.5"/>

    <!-- Dome cap -->
    <polygon points="340,74 266,112 414,112" fill="#475569"/>
    <polygon points="340,74 304,112 376,112" fill="#607080"/>

    <!-- Lightning rod -->
    <line x1="340" y1="50" x2="340" y2="74" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="340" cy="46" r="5.5" fill="#94a3b8"/>

    <!-- Lantern glow -->
    <circle cx="340" cy="143" r="36" fill="#fbbf24" opacity="0.20"/>
    <circle cx="340" cy="143" r="24" fill="#fbbf24" opacity="0.55"/>
    <circle cx="340" cy="143" r="15" fill="#fef3c7"/>
    <circle cx="340" cy="143" r="7"  fill="white"/>

    <!-- BEAM name -->
    <text x="340" y="622" text-anchor="middle" fill="#fbbf24"
          font-size="68" font-weight="600" letter-spacing="12" font-family="sans-serif">BEAM</text>

  </g>
</svg>
