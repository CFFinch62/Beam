<!-- BEAM file icon, dark themes. The lighthouse from images/beam_icon.svg
     reduced to what survives at the 16px the explorer renders: a tapered
     tower, its lamp, and the two beams. The full icon's stars, sea and
     wordmark all disappear at this size, but the beams are the thing the
     language is named for, so they are what is kept — and they are drawn
     wide enough that antialiasing cannot close the gap between them.
     Drawn as geometry so it needs no font. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Beams, sweeping left and right from the lamp. -->
  <g fill="#fbbf24" opacity="0.55">
    <polygon points="7.3,4.2 0.6,1.9 0.6,6.0"/>
    <polygon points="8.7,4.2 15.4,1.9 15.4,6.0"/>
  </g>
  <!-- Lamp. -->
  <rect x="6.7" y="2.6" width="2.6" height="3.1" rx="0.5" fill="#fef3c7"/>
  <!-- Tower, tapering to a wider base, plus the base slab. -->
  <polygon points="6.5,6.2 9.5,6.2 10.4,13.2 5.6,13.2" fill="#c4c0b4"/>
  <rect x="4.7" y="13.2" width="6.6" height="1.6" rx="0.4" fill="#94a3b8"/>
</svg>
